<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <!-- 移动端优化核心：禁用缩放，适配刘海屏 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lisp Web Todo</title>
  
  <!-- 1. Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. SortableJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <!-- 3. Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- 4. Toastify -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          animation: {
            'card-enter': 'card-enter 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)',
            'item-enter': 'item-enter 0.3s ease-out forwards',
            'item-remove': 'item-remove 0.3s ease-in forwards',
            'float-slow': 'float 6s ease-in-out infinite',
            'wiggle-interval': 'wiggle 5s ease-in-out infinite',
          },
          keyframes: {
            'card-enter': {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'item-enter': {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'item-remove': {
              '0%': { opacity: '1', transform: 'scale(1)', maxHeight: '60px', marginBottom: '8px' },
              '100%': { opacity: '0', transform: 'scale(0.9)', maxHeight: '0px', marginBottom: '0px', padding: '0px' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-3px)' },
            },
            wiggle: {
              '0%, 85%': { transform: 'rotate(0deg)' },
              '90%': { transform: 'rotate(-10deg)' },
              '95%': { transform: 'rotate(10deg)' },
              '100%': { transform: 'rotate(0deg)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    html, body {
      -ms-overflow-style: none;
      scrollbar-width: none;
      /* 防止 iOS 点击高亮背景色 */
      -webkit-tap-highlight-color: transparent; 
    }
    
    .sortable-ghost {
      opacity: 0.4;
      background-color: #f8fafc;
      border: 2px dashed #cbd5e1;
    }
    .sortable-drag {
      cursor: grabbing;
      opacity: 1 !important;
      background-color: white;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transform: scale(1.02);
      z-index: 50;
      border: 1px solid #e2e8f0;
    }
    .drag-disabled .drag-handle { 
      opacity: 0.2; 
      cursor: not-allowed; 
    }
    
    .toastify {
      font-family: inherit;
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .animated-icon-wrapper {
      position: relative;
      overflow: hidden;
    }
    .animated-icon-wrapper::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
      transform: skewX(-25deg);
      animation: shine 6s infinite 3s;
    }
    @keyframes shine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }
  </style>
</head>

<!-- 调整 padding: 移动端更紧凑 (px-3 py-4) -->
<body class="bg-gray-50 text-slate-800 min-h-screen py-4 px-3 sm:py-10 sm:px-4 no-scrollbar">

  <div id="demo-banner" class="hidden fixed top-0 left-0 w-full bg-amber-50 border-b border-amber-100 text-amber-700 text-center py-2 text-sm z-50 flex items-center justify-center gap-2">
    <i class="ph ph-warning-circle text-lg"></i>
    <span>后端未连接，演示模式 (仅本地)</span>
  </div>

  <!-- 状态栏: 移动端稍微往上提一点，避免贴底太近 -->
  <div id="status-bar" class="fixed bottom-6 right-4 sm:right-6 bg-white/95 backdrop-blur border border-gray-100 shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-full px-4 py-2.5 flex items-center gap-2.5 text-xs font-medium text-gray-500 transition-all duration-300 opacity-0 transform translate-y-4 z-40 pointer-events-none">
    <i id="status-icon" class="ph ph-check-circle text-emerald-500 text-lg"></i>
    <span id="status-text">所有更改已保存</span>
  </div>

  <!-- 主容器: 调整移动端 padding (p-5) -->
  <div class="app w-full max-w-xl mx-auto bg-white rounded-2xl shadow-xl p-5 sm:p-8 animate-card-enter mt-2 sm:mt-4 relative">
    
    <!-- Header -->
    <header class="mb-6 sm:mb-8 flex items-center gap-4">
      <div class="animated-icon-wrapper w-12 h-12 sm:w-14 sm:h-14 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-indigo-200 animate-float-slow shrink-0">
        <i class="ph-bold ph-list-checks text-2xl sm:text-3xl animate-wiggle-interval origin-bottom"></i>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-gray-800 tracking-tight">Lisp Web Todo</h1>
        <p class="text-xs sm:text-sm text-gray-400 mt-0.5 font-medium">拖拽排序 · 实时同步 · 极致体验</p>
      </div>
    </header>

    <!-- Input Section -->
    <div class="flex gap-2 sm:gap-3 mb-6 transition-all">
      <div class="relative flex-1 group focus-within:ring-2 focus-within:ring-indigo-100 rounded-xl transition-all">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
           <i class="ph ph-plus text-lg"></i>
        </div>
        <!-- 移动端关键优化: text-base 防止 iOS 自动缩放, 桌面端 text-sm 保持精致 -->
        <input 
          id="new-text" type="text" placeholder="添加新任务..." 
          class="block w-full pl-10 pr-4 py-3 bg-gray-50 border-0 text-gray-900 placeholder-gray-400 rounded-xl focus:ring-0 focus:bg-white transition-colors text-base sm:text-sm"
        >
      </div>
      <button 
        id="add-btn"
        class="px-4 sm:px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 disabled:opacity-70 disabled:cursor-not-allowed flex items-center gap-2 text-sm whitespace-nowrap"
      >
        <span>添加</span>
        <i class="ph-bold ph-arrow-right hidden sm:inline"></i>
      </button>
    </div>

    <!-- Toolbar -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
      <div class="flex w-full sm:w-auto p-1 bg-gray-100/80 rounded-lg">
        <button onclick="TodoApp.setFilter('all')" id="tab-all" class="flex-1 sm:flex-none justify-center px-4 py-1.5 text-xs font-medium rounded-md bg-white text-gray-700 shadow-sm transition-all flex items-center gap-1">
          <i class="ph-bold ph-list"></i> 全部
        </button>
        <button onclick="TodoApp.setFilter('active')" id="tab-active" class="flex-1 sm:flex-none justify-center px-4 py-1.5 text-xs font-medium rounded-md text-gray-500 hover:text-gray-700 transition-all flex items-center gap-1">
          <i class="ph-bold ph-circle"></i> 待办
        </button>
        <button onclick="TodoApp.setFilter('completed')" id="tab-completed" class="flex-1 sm:flex-none justify-center px-4 py-1.5 text-xs font-medium rounded-md text-gray-500 hover:text-gray-700 transition-all flex items-center gap-1">
          <i class="ph-bold ph-check-circle"></i> 已完成
        </button>
      </div>

      <div class="relative w-full sm:w-auto flex-1 sm:max-w-[200px]">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <i class="ph ph-magnifying-glass text-gray-400"></i>
        </div>
        <input 
          type="text" id="search-input" oninput="TodoApp.setSearch(this.value)"
          placeholder="搜索..." 
          class="block w-full pl-9 pr-3 py-1.5 border border-gray-200 rounded-lg text-base sm:text-xs placeholder-gray-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 bg-white"
        >
      </div>
    </div>

    <!-- List -->
    <ul id="list" class="space-y-2 max-h-[60vh] overflow-y-auto no-scrollbar pb-2 pr-1 min-h-[50px] relative"></ul>

    <!-- Empty State -->
    <div id="empty-tip" class="hidden flex flex-col items-center justify-center py-12 text-center animate-card-enter">
      <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-300">
        <i class="ph-duotone ph-clipboard-text text-3xl"></i>
      </div>
      <p id="empty-text" class="text-gray-400 text-sm">还没有任务，开始新的一天吧！</p>
    </div>

    <!-- Footer -->
    <div id="summary" class="mt-6 pt-4 border-t border-dashed border-gray-100 text-right text-xs text-gray-400 font-medium font-mono h-6"></div>
  </div>

  <script>
    /**
     * =================================================================
     * Lisp Web Todo Application Logic
     * =================================================================
     */

    const State = {
      todos: [],          
      filter: 'all',      
      search: '',         
      isDragging: false,  
      isDemoMode: false,  
      mockData: []        
    };

    try {
      const saved = localStorage.getItem('lisp_todo_mock');
      if (saved) State.mockData = JSON.parse(saved);
    } catch(e) {}

    const API = {
      async request(endpoint, options = {}) {
        if (State.isDemoMode) return this.mockRequest(endpoint, options);
        try {
          const res = await fetch(endpoint, options);
          if (!res.ok) throw new Error('API Error');
          return await res.json();
        } catch (e) {
          this.enableDemoMode();
          return this.mockRequest(endpoint, options);
        }
      },

      enableDemoMode() {
        if (State.isDemoMode) return;
        State.isDemoMode = true;
        document.getElementById('demo-banner').classList.remove('hidden');
        TodoApp.handleDataUpdate(State.mockData, { animate: true });
      },

      async mockRequest(endpoint, options) {
        await new Promise(r => setTimeout(r, 400));
        
        const method = options.method || 'GET';
        const url = new URL(endpoint, 'http://d');
        const idParam = url.searchParams.get('id');

        if (url.pathname.includes('/reorder')) {
          const body = JSON.parse(options.body);
          const ids = body.ids;
          const newOrder = [];
          ids.forEach(id => {
            const item = State.mockData.find(t => t.id == id);
            if (item) newOrder.push(item);
          });
          State.mockData.forEach(item => { if (!ids.includes(item.id)) newOrder.push(item); });
          State.mockData = newOrder;
          this.saveMock();
          return State.mockData;
        }

        if (method === 'GET') return State.mockData;
        
        if (method === 'POST') {
          const body = JSON.parse(options.body);
          State.mockData.unshift({ id: Date.now(), text: body.text, done: false });
          this.saveMock();
          return State.mockData;
        }
        
        if (method === 'PATCH') {
          if (idParam) {
            const body = JSON.parse(options.body);
            const t = State.mockData.find(x => x.id == idParam);
            if (t && typeof body.done !== 'undefined') t.done = body.done;
            this.saveMock();
          }
          return State.mockData;
        }
        
        if (method === 'DELETE') {
          State.mockData = State.mockData.filter(t => t.id != idParam);
          this.saveMock();
          return State.mockData;
        }
        return [];
      },

      saveMock() {
        localStorage.setItem('lisp_todo_mock', JSON.stringify(State.mockData));
      }
    };

    const UI = {
      setSyncStatus(state) {
        const bar = document.getElementById('status-bar');
        const icon = document.getElementById('status-icon');
        const text = document.getElementById('status-text');
        
        if (this._syncTimeout) clearTimeout(this._syncTimeout);
        
        bar.classList.remove('opacity-0', 'translate-y-4');

        if (state === 'saving') {
          icon.className = 'ph ph-spinner ph-spin text-indigo-500 text-lg';
          text.textContent = '正在同步...';
        } else if (state === 'saved') {
          icon.className = 'ph ph-check-circle text-emerald-500 text-lg';
          text.textContent = '已保存'; // 移动端文案精简
          this._syncTimeout = setTimeout(() => { 
            bar.classList.add('opacity-0', 'translate-y-4'); 
          }, 2000);
        } else if (state === 'error') {
          icon.className = 'ph ph-warning-circle text-red-500 text-lg';
          text.textContent = '同步失败';
        }
      },

      showToast(msg, type = 'info') {
        Toastify({
          text: msg,
          duration: 3000,
          gravity: "bottom", // 移动端改为底部弹出更符合习惯
          position: "center", 
          stopOnFocus: true,
          style: {
            background: type === 'error' ? "#ef4444" : "#1f2937",
            boxShadow: "0 10px 15px -3px rgba(0, 0, 0, 0.1)",
            borderRadius: "0.75rem", 
            fontSize: "0.875rem", 
            fontWeight: "500", 
            padding: "0.75rem 1.5rem",
            marginBottom: "4rem" // 避开状态栏
          },
        }).showToast();
      },

      renderList(todos, options = {}) {
        const { animate = false } = options;
        
        let filtered = todos.filter(item => {
          if (State.filter === 'active' && item.done) return false;
          if (State.filter === 'completed' && !item.done) return false;
          if (State.search && !item.text.toLowerCase().includes(State.search)) return false;
          return true;
        });

        const ul = document.getElementById('list');
        const allowSort = (State.filter === 'all' && !State.search); 
        
        ul.innerHTML = ''; 

        if (!filtered.length) {
          document.getElementById('empty-tip').classList.remove('hidden');
          document.getElementById('empty-text').textContent = 
            todos.length > 0 ? '没有找到相关任务' : '还没有任务，开始新的一天吧！';
          document.getElementById('summary').textContent = '';
        } else {
          document.getElementById('empty-tip').classList.add('hidden');
        }

        let doneCount = 0;
        todos.forEach(t => { if(t.done) doneCount++; });

        filtered.forEach(item => {
          const li = this.createTodoItem(item, allowSort, animate);
          ul.appendChild(li);
        });

        const total = todos.length;
        if (total > 0) {
          const pending = total - doneCount;
          let summaryText = `${pending} 待办 / ${total} 总计`;
          if (filtered.length !== total) summaryText += ` (筛选中)`;
          document.getElementById('summary').textContent = summaryText;
        }

        TodoApp.initSortable(ul, allowSort);
      },

      createTodoItem(item, allowSort, animate) {
        const isDone = !!item.done;
        const li = document.createElement('li');
        li.setAttribute('data-id', item.id);

        let liClasses = [
          'group', 'flex', 'items-center', 'justify-between', 
          'p-3', 'rounded-xl', 'border', 
          'transition-all', 'duration-200',
          'bg-white', 'select-none'
        ];

        if (isDone) liClasses.push('bg-gray-50/50', 'border-transparent');
        else liClasses.push('border-gray-100', 'hover:border-indigo-200', 'hover:shadow-md', 'hover:shadow-indigo-100/50');
        
        if (!allowSort) liClasses.push('drag-disabled');
        if (animate) liClasses.push('animate-item-enter');

        li.className = liClasses.join(' ');

        // 移动端优化: opacity-100 始终显示删除按钮 (移动端无 hover 状态)
        // 桌面端 (sm:): 保持 opacity-0 group-hover:opacity-100
        li.innerHTML = `
          <div class="drag-handle mr-3 text-gray-300 cursor-grab active:cursor-grabbing flex-shrink-0 outline-none flex items-center justify-center w-6 h-6 rounded hover:bg-gray-100 transition-colors ${!allowSort ? 'opacity-20 cursor-not-allowed' : 'hover:text-gray-600'}">
            <i class="ph-bold ph-dots-six-vertical text-lg"></i>
          </div>
          
          <input type="checkbox" class="todo-check w-5 h-5 text-indigo-600 rounded-md border-gray-300 focus:ring-indigo-500 cursor-pointer transition mr-3" ${isDone ? 'checked' : ''}>
          
          <span class="flex-1 text-sm break-all transition-colors duration-200 cursor-default ${isDone ? 'text-gray-400 line-through decoration-gray-300' : 'text-gray-700 font-medium'}">
            ${State.search ? item.text.replace(new RegExp(`(${State.search})`, 'gi'), '<span class="bg-amber-100 text-amber-800 px-1 rounded">$1</span>') : item.text}
          </span>
          
          <button class="todo-del p-2 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all opacity-100 sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100 ml-2" title="删除">
            <i class="ph-bold ph-trash text-lg"></i>
          </button>
        `;

        li.querySelector('.todo-check').addEventListener('change', (e) => {
          TodoApp.toggleTodo(item.id, e.target.checked);
        });

        li.querySelector('.todo-del').addEventListener('click', () => {
          li.classList.add('animate-item-remove', 'overflow-hidden');
          li.addEventListener('animationend', () => {
             TodoApp.deleteTodo(item.id);
          }, { once: true });
        });

        return li;
      },

      updateFilterTabs(status) {
        ['all', 'active', 'completed'].forEach(t => {
          const btn = document.getElementById('tab-' + t);
          const isActive = (t === status);
          btn.className = `flex-1 sm:flex-none justify-center px-4 py-1.5 text-xs font-medium rounded-md transition-all flex items-center gap-1 ${isActive ? 'bg-white text-gray-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`;
        });
      }
    };

    const TodoApp = {
      sortableInstance: null,

      async init() {
        this.bindEvents();
        this.setupSSE();
        const data = await API.request('/api/todos');
        this.handleDataUpdate(data, { animate: true });
      },

      handleDataUpdate(newData, options = {}) {
        if (State.isDragging) return;
        State.todos = Array.isArray(newData) ? newData : [];
        UI.renderList(State.todos, options);
      },

      bindEvents() {
        document.getElementById('add-btn').addEventListener('click', () => this.addTodo());
        document.getElementById('new-text').addEventListener('keydown', e => { 
          if (e.key === 'Enter') this.addTodo(); 
        });
      },

      async addTodo() {
        const input = document.getElementById('new-text');
        const btn = document.getElementById('add-btn');
        const text = input.value.trim();
        if (!text) return;

        btn.disabled = true;
        btn.innerHTML = `<i class="ph ph-spinner ph-spin text-xl"></i>`;
        
        try {
          if (State.filter !== 'all' || State.search) { 
             this.setFilter('all'); this.setSearch(''); 
             document.getElementById('search-input').value=''; 
          }
          
          UI.setSyncStatus('saving');
          const data = await API.request('/api/todos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
          });
          
          input.value = '';
          this.handleDataUpdate(data, { animate: true });
          UI.setSyncStatus('saved');
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<span>添加</span><i class="ph-bold ph-arrow-right hidden sm:inline"></i>`;
          input.focus();
        }
      },

      async toggleTodo(id, checked) {
        UI.setSyncStatus('saving');
        const data = await API.request('/api/todos?id=' + encodeURIComponent(id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ done: checked })
        });
        this.handleDataUpdate(data, { animate: false });
        UI.setSyncStatus('saved');
      },

      async deleteTodo(id) {
        UI.setSyncStatus('saving');
        const data = await API.request('/api/todos?id=' + encodeURIComponent(id), { method: 'DELETE' });
        this.handleDataUpdate(data, { animate: false });
        UI.setSyncStatus('saved');
      },

      setFilter(status) {
        State.filter = status;
        UI.updateFilterTabs(status);
        UI.renderList(State.todos, { animate: true });
      },

      setSearch(val) {
        State.search = val.trim().toLowerCase();
        UI.renderList(State.todos, { animate: false });
      },

      initSortable(el, enabled) {
        if (this.sortableInstance) {
          this.sortableInstance.destroy();
          this.sortableInstance = null;
        }
        if (!enabled) return;

        this.sortableInstance = Sortable.create(el, {
          handle: '.drag-handle',
          animation: 250,
          ghostClass: 'sortable-ghost',
          dragClass: 'sortable-drag',
          delay: 100, 
          delayOnTouchOnly: true,
          
          onStart: () => {
            State.isDragging = true;
            document.body.style.cursor = 'grabbing';
          },
          
          onEnd: async (evt) => {
            State.isDragging = false;
            document.body.style.cursor = '';
            
            const { oldIndex, newIndex } = evt;
            if (oldIndex === newIndex) return;

            const newIds = this.sortableInstance.toArray().map(id => parseInt(id));
            
            const newOrder = [];
            newIds.forEach(id => {
              const item = State.todos.find(t => t.id === id);
              if (item) newOrder.push(item);
            });
            State.todos.forEach(item => { if (!newIds.includes(item.id)) newOrder.push(item); });
            
            const backup = [...State.todos];
            State.todos = newOrder;

            UI.setSyncStatus('saving');
            try {
              await API.request('/api/todos/reorder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids: newIds })
              });
              UI.setSyncStatus('saved');
            } catch (e) {
              UI.showToast('排序同步失败', 'error');
              State.todos = backup;
              UI.renderList(State.todos, { animate: false });
            }
          }
        });
      },

      setupSSE() {
        if (!('EventSource' in window)) return;
        
        try {
          const es = new EventSource('/api/todos/events');
          es.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              if (State.isDemoMode) {
                State.isDemoMode = false; 
                document.getElementById('demo-banner').classList.add('hidden'); 
              }
              this.handleDataUpdate(data, { animate: false });
            } catch (err) {}
          };
        } catch(e) {}
      }
    };

    TodoApp.init();

  </script>
</body>
</html>
